name: Gerar APK Niez Animes

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Montar catálogo local 30k+
        run: python scripts/build_catalog.py

      - name: Preparar ícone adaptativo Niez Animes
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/niez_foreground_runtime.png
          file app/src/main/res/drawable-nodpi/niez_foreground_runtime.png

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Niez-Animes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
