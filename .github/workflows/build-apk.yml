name: Gerar APK Niez Animes

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar JavaScript do app
        run: |
          node --check app/src/main/assets/video_sources.js
          node --check app/src/main/assets/player_enhance.js
          node --check app/src/main/assets/online_enhance.js
          node --check app/src/main/assets/explore_enhance.js
          node --check app/src/main/assets/details_plus.js
          node tests/sources.test.cjs

      - name: Testar interface do player
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/player.test.cjs

      - name: Montar catálogo local 30k+
        run: python scripts/build_catalog.py

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Niez-Animes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
