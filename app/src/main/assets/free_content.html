<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>Conteúdo Livre • Órbita Anime</title><style>*{box-sizing:border-box}body{margin:0;background:#070708;color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(7,7,8,.96);backdrop-filter:blur(12px);padding:14px 14px 12px;border-bottom:1px solid #24242a}.row{display:flex;gap:10px;align-items:center}.back{border:0;background:#202027;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.title{font-weight:900;font-size:19px}.sub{color:#aaa;font-size:12px;margin-top:4px;line-height:1.45}.wrap{padding:14px 14px 30px}.notice{background:#141418;border:1px solid #292930;border-radius:16px;padding:13px;margin-bottom:14px;color:#ccc;line-height:1.55}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{background:#121216;border:1px solid #25252b;border-radius:18px;padding:13px}.card h3{margin:0 0 5px;font-size:16px}.meta{font-size:12px;color:#aaa;margin-bottom:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;background:#e6244f;color:#fff}.infoBtn{border:0;background:#24242b;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.license{margin-top:9px;font-size:11px;color:#8f8f98}.playerBox{display:none;position:fixed;inset:0;z-index:20;background:#000}.playerTop{position:absolute;left:0;right:0;top:0;z-index:3;padding:10px;background:linear-gradient(#000c,transparent);display:flex;align-items:center;gap:10px}.playerTop button{border:0;background:#222c;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.playerTitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerBox video{width:100%;height:100%;object-fit:contain;background:#000}.sheet{display:none;position:fixed;inset:0;z-index:30;background:#000a;align-items:flex-end}.sheetCard{width:100%;background:#17171c;border-radius:22px 22px 0 0;padding:18px;border-top:1px solid #303038}.sheetCard h3{margin:0 0 8px}.sheetCard p{color:#bbb;line-height:1.55}.closeSheet{width:100%;border:0;border-radius:13px;padding:12px;background:#2a2a31;color:#fff;font-weight:800}.srcText{font-size:11px;color:#8d8d96;word-break:break-all}@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header class="top"><div class="row"><button class="back" onclick="location.href='online_catalog.html'">← Voltar</button><div><div class="title">🎞️ Conteúdo Livre</div><div class="sub">Assista direto no Órbita Anime, sem abrir navegador ou outro site.</div></div></div></header><main class="wrap"><div class="notice">Os vídeos abaixo são reproduzidos dentro do player do próprio app. Eles são transmitidos de uma fonte externa de conteúdo livre, mas você não sai do Órbita Anime para assistir.</div><div id="grid" class="grid"></div></main><div id="playerBox" class="playerBox"><div class="playerTop"><button id="closePlayer">✕ Fechar</button><div id="playerTitle" class="playerTitle"></div></div><video id="player" controls playsinline preload="metadata"></video></div><div id="sheet" class="sheet"><div class="sheetCard"><h3 id="sheetTitle">Licença</h3><p id="sheetBody"></p><div id="sheetSource" class="srcText"></div><button class="closeSheet" id="closeSheet">Fechar</button></div></div><script>const items=[{title:'Kobu-tori Jiisan',year:1929,duration:'10 min',file:'Kobu-tori Jiisan (1929).webm',page:'https://commons.wikimedia.org/wiki/File:Kobu-tori_Jiisan_(1929).webm'},{title:'Spring Song',year:1931,duration:'3 min',file:'Spring Song (1931).webm',page:'https://commons.wikimedia.org/wiki/File:Spring_Song_(1931).webm'},{title:'Ugokie-Ko-Ri-No-Tatehiki',year:1933,duration:'11 min',file:'Ugokie-Ko-Ri-No-Tatehiki (1933).webm',page:'https://commons.wikimedia.org/wiki/File:Ugokie-Ko-Ri-No-Tatehiki_(1933).webm'},{title:'The Three Fearless Frogs',year:1933,duration:'6 min',file:'The Three Fearless Frogs (1933).webm',page:'https://commons.wikimedia.org/wiki/File:The_Three_Fearless_Frogs_(1933).webm'},{title:'Spring Comes to Ponsuke',year:1934,duration:'7 min',file:'Spring Comes to Ponsuke (1934).webm',page:'https://commons.wikimedia.org/wiki/File:Spring_Comes_to_Ponsuke_(1934).webm'}];const grid=document.getElementById('grid'),box=document.getElementById('playerBox'),v=document.getElementById('player'),pt=document.getElementById('playerTitle'),sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheetTitle'),sheetBody=document.getElementById('sheetBody'),sheetSource=document.getElementById('sheetSource');function videoUrl(file){return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}items.forEach((x,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<h3>${esc(x.title)}</h3><div class="meta">Japão • ${x.year} • ${x.duration}</div><div class="actions"><button class="btn" data-play="${i}">▶ Assistir</button><button class="infoBtn" data-info="${i}">ⓘ Licença</button></div><div class="license">Reprodução dentro do Órbita Anime.</div>`;grid.appendChild(el)});grid.addEventListener('click',e=>{const p=e.target.closest('[data-play]');if(p){const x=items[Number(p.dataset.play)];pt.textContent=x.title+' ('+x.year+')';v.src=videoUrl(x.file);box.style.display='block';v.play().catch(()=>{});return}const b=e.target.closest('[data-info]');if(b){const x=items[Number(b.dataset.info)];sheetTitle.textContent=x.title+' • licença';sheetBody.textContent='Arquivo indicado como domínio público na página de origem da Wikimedia Commons. A informação da fonte fica aqui dentro do app e não abre navegador.';sheetSource.textContent='Fonte: '+x.page;sheet.style.display='flex'}});document.getElementById('closePlayer').onclick=()=>{v.pause();v.removeAttribute('src');v.load();box.style.display='none'};document.getElementById('closeSheet').onclick=()=>sheet.style.display='none';sheet.onclick=e=>{if(e.target===sheet)sheet.style.display='none'};</script></body></html>
