<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>Órbita Anime</title>
<style>
:root{--bg:#070708;--p:#121214;--line:#29292f;--txt:#f8f8fa;--mut:#9696a0;--red:#ff4a38;--green:#29d98b;--blue:#4e8cff;--purple:#a45cff;--yellow:#ffd43b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{padding-bottom:90px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:13px 15px;background:#09090be8;backdrop-filter:blur(14px);border-bottom:1px solid #1d1d21}.brand{font-size:21px;font-weight:950}.brand b{color:var(--red)}.icon,.btn,.chip,.tab{border:1px solid var(--line);background:#141417;color:#fff}.icon{margin-left:auto;width:42px;height:42px;border-radius:50%;font-size:20px}.main{max-width:940px;margin:auto;padding:0 15px}.hero{padding:24px 0 12px}.kicker{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:950}h1{font-size:42px;line-height:.98;letter-spacing:-2px;margin:8px 0 9px}h2{font-size:25px;letter-spacing:-1px;margin:22px 0 12px}.muted{color:var(--mut)}.search{display:flex;gap:8px;margin:15px 0}.search input,.filters select,.field input,.field select{width:100%;background:#121216;color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}.btn{padding:12px 14px;border-radius:14px;font-weight:850}.btn.red{background:linear-gradient(135deg,#ff4937,#ff684a);border:0}.btn.full{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:#b9b9c1}.chip.on{background:var(--red);border-color:var(--red);color:#fff}.combo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.combo button{text-align:left;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17171b,#101013);color:#fff;padding:14px}.combo b{display:block}.combo span{display:block;color:var(--mut);font-size:11px;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0}.poster{position:relative;aspect-ratio:2/3;border-radius:17px;overflow:hidden;background:#18181d;border:1px solid #24242a}.poster img{width:100%;height:100%;object-fit:cover}.score{position:absolute;right:9px;bottom:9px;background:#27251b;border:1px solid #5c5225;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:900}.status{position:absolute;top:9px;right:9px;padding:5px 7px;border-radius:8px;background:#35353e;font-size:10px;font-weight:900}.status.vendo{background:var(--green);color:#042819}.status.fim{background:var(--blue)}.status.drop{background:var(--red)}.ct{font-size:14px;font-weight:850;margin:7px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm{display:flex;justify-content:space-between;gap:6px;color:var(--mut);font-size:11px;margin:0 4px}.tagline{font-size:10px;color:#bc9cff;margin:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{background:linear-gradient(180deg,#151519,#101013);border:1px solid var(--line);border-radius:22px;padding:16px;margin:13px 0}.empty{text-align:center;padding:38px 15px;border:1px dashed #2a2a31;border-radius:20px;color:#85858f}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 13px;scrollbar-width:none}.tab{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:#aaaab3}.tab.on{background:#fff;color:#09090a}.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px max(10px,env(safe-area-inset-bottom));background:#0d0d10ef;border-top:1px solid #222228;backdrop-filter:blur(16px)}.nav button{border:0;background:transparent;color:#777781;font-weight:800;font-size:10px;display:grid;gap:3px;justify-items:center}.nav button i{font-style:normal;font-size:21px}.nav button.on{color:var(--red)}.modal{display:none;position:fixed;inset:0;z-index:70;background:#000c;backdrop-filter:blur(9px);align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#0e0e11;border:1px solid #292930;border-radius:27px 27px 0 0;padding:17px 15px 28px}.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-17px;background:#0e0e11ef;padding:16px 0 9px;z-index:3}.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#17171b;color:#fff;font-size:20px}.row{display:flex;gap:10px}.row>*{flex:1}.field{margin:11px 0}.profile{text-align:center;padding:24px 0}.avatar{width:105px;height:105px;margin:auto;border-radius:50%;padding:5px;background:linear-gradient(135deg,var(--yellow),#ff922e)}.avatar div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#18181d;font-size:48px}.name{font-size:32px;font-weight:950;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#18181c;border:1px solid #26262d;border-radius:16px;padding:13px 8px;text-align:center}.stat small{display:block;color:var(--mut);font-size:9px;font-weight:900}.stat b{display:block;font-size:20px;margin-top:4px}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);opacity:0;transition:.2s;background:#202025;border:1px solid #35353d;border-radius:999px;padding:9px 14px;font-size:12px}.toast.on{opacity:1;transform:translateX(-50%)}.license{font-size:10px;color:#686872;text-align:center;padding:24px 4px 4px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.combo{grid-template-columns:repeat(4,1fr)}.nav{max-width:940px;left:50%;transform:translateX(-50%)}.sheet{max-width:720px;margin:auto}}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Órbita <b>Anime</b></div><button class="icon" id="findBtn">⌕</button></header><main class="main" id="view"><div class="empty" style="margin-top:30px">Carregando catálogo...</div></main><nav class="nav"><button data-r="catalog" class="on"><i>▦</i>Catálogo</button><button data-r="themes"><i>◈</i>Temas</button><button data-r="list"><i>▥</i>Minha Lista</button><button data-r="profile"><i>◉</i>Perfil</button></nav></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheethead"><h3>Detalhes</h3><button class="close" onclick="modal(false)">×</button></div><div id="detail"></div></div></div><div class="toast" id="toast"></div>
<script src="anime-catalog.js"></script><script>
const DB=Array.isArray(window.ANIME_DB)?window.ANIME_DB:[],META=window.ANIME_DB_META||{},$=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const S={r:'catalog',q:'',type:'',year:'',tags:[],sort:'score',shown:60,tab:'todos',list:JSON.parse(localStorage.getItem('oa_list')||'[]'),profile:JSON.parse(localStorage.getItem('oa_profile')||'{"name":"Mestre da Guilda","avatar":"🧙"}')};
const MAP={isekai:'Isekai',romance:'Romance',fantasy:'Fantasia',action:'Ação',comedy:'Comédia',drama:'Drama',school:'Escolar',supernatural:'Sobrenatural',shounen:'Shounen',adventure:'Aventura',mystery:'Mistério',sports:'Esporte','slice of life':'Slice of Life',mecha:'Mecha',magic:'Magia',music:'Música',historical:'Histórico',psychological:'Psicológico',thriller:'Suspense',military:'Militar',demons:'Demônios',vampire:'Vampiro',samurai:'Samurai'};
const pt=t=>MAP[t]||t.replace(/\b\w/g,c=>c.toUpperCase()),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.setItem('oa_list',JSON.stringify(S.list));localStorage.setItem('oa_profile',JSON.stringify(S.profile))};const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)};const label=s=>({planos:'PLAN',vendo:'VENDO',fim:'FIM',drop:'DROP'}[s]||'');
function mine(id){return S.list.find(x=>String(x.id)===String(id))}function card(a){let m=mine(a.id),x=m?{...a,...m}:a;return `<article class="card" data-id="${esc(a.id)}"><div class="poster">${x.image?`<img loading="lazy" src="${esc(x.thumb||x.image)}" onerror="this.src='${esc(x.image)}'">`:''}${m?`<span class="status ${x.status}">${label(x.status)}</span>`:''}${x.score?`<span class="score">★ ${Number(x.score).toFixed(1)}</span>`:''}</div><div class="ct">${esc(x.title)}</div><div class="cm"><span>${x.year||'—'} • ${x.episodes||'?'} eps</span><span>${esc(x.type)}</span></div><div class="tagline">${esc((x.tags||[]).slice(0,3).map(pt).join(' • '))}</div></article>`}
function filtered(){let q=S.q.trim().toLowerCase(),arr=DB.filter(a=>(!q||a.title.toLowerCase().includes(q)||(a.syn||[]).some(x=>String(x).toLowerCase().includes(q)))&&(!S.type||a.type===S.type)&&(!S.year||String(a.year)===S.year)&&S.tags.every(t=>(a.tags||[]).includes(t)));if(S.sort==='title')arr.sort((a,b)=>a.title.localeCompare(b.title));else if(S.sort==='year')arr.sort((a,b)=>(b.year||0)-(a.year||0));else arr.sort((a,b)=>(b.score||0)-(a.score||0));return arr}
function bind(host,arr){$$('.card',host).forEach(c=>c.onclick=()=>details(arr.find(a=>String(a.id)===c.dataset.id)))}
function catalog(){let arr=filtered(),slice=arr.slice(0,S.shown);view.innerHTML=`<section class="hero"><div class="kicker">CATÁLOGO</div><h1>${Number(META.count||DB.length).toLocaleString('pt-BR')}+ animes no banco.</h1><div class="muted">Pesquise e combine temas. Sem roleta.</div></section><div class="search"><input id="q" value="${esc(S.q)}" placeholder="Buscar anime..."><button class="btn red" id="search">Buscar</button></div><div class="filters"><select id="type"><option value="">Todos os formatos</option>${['TV','MOVIE','OVA','ONA','SPECIAL','UNKNOWN'].map(x=>`<option ${S.type===x?'selected':''}>${x}</option>`).join('')}</select><select id="year"><option value="">Todos os anos</option>${Array.from({length:90},(_,i)=>2027-i).map(y=>`<option ${S.year===String(y)?'selected':''}>${y}</option>`).join('')}</select></div><div class="filters"><select id="sort"><option value="score" ${S.sort==='score'?'selected':''}>Melhor nota</option><option value="year" ${S.sort==='year'?'selected':''}>Mais novos</option><option value="title" ${S.sort==='title'?'selected':''}>A–Z</option></select><button class="btn" id="clear">Limpar filtros</button></div><div class="chips">${S.tags.length?S.tags.map(t=>`<button class="chip on" data-tag="${esc(t)}">${esc(pt(t))} ×</button>`).join(''):'<span class="muted" style="font-size:12px">Escolha temas na aba Temas.</span>'}</div><div class="muted" style="font-size:12px;margin:2px 0 12px">${arr.length.toLocaleString('pt-BR')} títulos encontrados</div><div class="grid" id="grid">${slice.length?slice.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nenhum anime encontrado.</div>'}</div>${S.shown<arr.length?'<button class="btn full" id="more" style="margin-top:18px">Carregar mais</button>':''}<div class="license">Dados: cedya77/anime-offline-database, derivado de manami-project (ODbL 1.0).</div>`;$('#search').onclick=()=>{S.q=$('#q').value;S.shown=60;catalog()};$('#q').onkeydown=e=>{if(e.key==='Enter')$('#search').click()};$('#type').onchange=e=>{S.type=e.target.value;S.shown=60;catalog()};$('#year').onchange=e=>{S.year=e.target.value;S.shown=60;catalog()};$('#sort').onchange=e=>{S.sort=e.target.value;catalog()};$('#clear').onclick=()=>{S.q='';S.type='';S.year='';S.tags=[];S.shown=60;catalog()};$$('[data-tag]').forEach(b=>b.onclick=()=>{S.tags=S.tags.filter(t=>t!==b.dataset.tag);S.shown=60;catalog()});$('#more')?.addEventListener('click',()=>{S.shown+=60;catalog()});bind($('#grid'),slice)}
const combos=[['isekai'],['romance'],['isekai','romance'],['fantasy'],['action'],['action','fantasy'],['fantasy','romance'],['school','romance'],['supernatural','action'],['adventure'],['comedy'],['drama'],['mystery'],['sports'],['slice of life'],['mecha']];
function tagCounts(){let c={};for(let a of DB)for(let t of a.tags||[])c[t]=(c[t]||0)+1;return c}const COUNTS=tagCounts();
function themes(){let popular=Object.entries(COUNTS).filter(([t,n])=>n>=120&&t.length<30).sort((a,b)=>b[1]-a[1]).slice(0,80);view.innerHTML=`<section class="hero"><div class="kicker">TEMAS</div><h1>Escolha o que quer assistir.</h1><div class="muted">Combine temas, por exemplo Isekai + Romance.</div></section><h2>Combinações rápidas</h2><div class="combo">${combos.map((c,i)=>`<button data-combo="${i}"><b>${c.map(pt).join(' + ')}</b><span>${DB.filter(a=>c.every(t=>(a.tags||[]).includes(t))).length.toLocaleString('pt-BR')} títulos</span></button>`).join('')}</div><h2>Temas populares</h2><div class="chips" style="flex-wrap:wrap;overflow:visible">${popular.map(([t,n])=>`<button class="chip ${S.tags.includes(t)?'on':''}" data-theme="${esc(t)}">${esc(pt(t))} (${n})</button>`).join('')}</div><button class="btn red full" id="apply">Ver catálogo</button>`;$$('[data-combo]').forEach(b=>b.onclick=()=>{S.tags=combos[Number(b.dataset.combo)];S.r='catalog';S.shown=60;render()});$$('[data-theme]').forEach(b=>b.onclick=()=>{let t=b.dataset.theme;S.tags=S.tags.includes(t)?S.tags.filter(x=>x!==t):[...S.tags,t];b.classList.toggle('on')});$('#apply').onclick=()=>{S.r='catalog';S.shown=60;render()}}
function counts(){let c={todos:S.list.length,planos:0,vendo:0,fim:0,drop:0};S.list.forEach(a=>c[a.status]=(c[a.status]||0)+1);return c}function list(){let c=counts(),arr=S.tab==='todos'?S.list:S.list.filter(x=>x.status===S.tab);view.innerHTML=`<section class="hero"><div class="kicker">SUA COLEÇÃO</div><h1>Minha Lista</h1><div class="muted">${c.todos} animes salvos</div></section><div class="tabs">${[['todos','Todos'],['vendo','Vendo'],['planos','Planos'],['fim','Finalizados'],['drop','Drop']].map(x=>`<button class="tab ${S.tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]} (${c[x[0]]||0})</button>`).join('')}</div><div class="grid" id="listGrid">${arr.length?arr.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Sua lista ainda está vazia.</div>'}</div>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;list()});bind($('#listGrid'),arr)}
function details(a){if(!a)return;let m=mine(a.id),x=m?{...a,...m}:a;$('#detail').innerHTML=`<div class="row" style="align-items:flex-start"><div class="poster" style="max-width:170px;flex:0 0 42%">${x.image?`<img src="${esc(x.image)}">`:''}</div><div><div class="kicker">${esc(x.type)} ${x.year?'• '+x.year:''}</div><h2 style="margin:8px 0">${esc(x.title)}</h2><div class="muted">${x.episodes||'?'} episódios ${x.score?'• ★ '+x.score:''}</div><div class="tagline" style="white-space:normal;margin-top:9px">${esc((x.tags||[]).map(pt).join(' • '))}</div></div></div>${m?`<div class="field"><label>Status</label><select id="st"><option value="planos" ${x.status==='planos'?'selected':''}>Planos</option><option value="vendo" ${x.status==='vendo'?'selected':''}>Vendo</option><option value="fim" ${x.status==='fim'?'selected':''}>Finalizado</option><option value="drop" ${x.status==='drop'?'selected':''}>Drop</option></select></div><div class="field"><label>Episódios assistidos</label><input id="wat" type="number" min="0" value="${x.watched||0}"></div><div class="row"><button class="btn red" id="saveA">Salvar</button><button class="btn" id="removeA">Remover</button></div>`:`<button class="btn red full" id="addA">＋ Adicionar aos Planos</button>`}`;modal(true);if(m){$('#saveA').onclick=()=>{m.status=$('#st').value;m.watched=Math.max(0,Number($('#wat').value)||0);save();modal(false);render();toast('Anime atualizado')};$('#removeA').onclick=()=>{S.list=S.list.filter(z=>String(z.id)!==String(m.id));save();modal(false);render();toast('Removido')}}else $('#addA').onclick=()=>{S.list.unshift({...a,status:'planos',watched:0});save();modal(false);render();toast('Adicionado aos Planos')}}
function modal(on){$('#detailModal').classList.toggle('on',on)}
function profile(){let c=counts(),eps=S.list.reduce((s,a)=>s+(Number(a.watched)||0),0),tags={};S.list.forEach(a=>(a.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));let fav=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';view.innerHTML=`<section class="profile"><div class="avatar"><div>${esc(S.profile.avatar||'🧙')}</div></div><div class="name">${esc(S.profile.name)}</div><div class="muted">Explorador de animes</div></section><div class="stats"><div class="stat"><small>NA LISTA</small><b>${c.todos}</b></div><div class="stat"><small>CONCLUÍDOS</small><b>${c.fim}</b></div><div class="stat"><small>EPS VISTOS</small><b>${eps}</b></div></div><div class="panel"><div class="kicker">TEMA FAVORITO</div><h2>${fav?esc(pt(fav)):'—'}</h2></div>`}
function render(){$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.r));({catalog,themes,list,profile}[S.r]||catalog)()}$$('.nav button').forEach(b=>b.onclick=()=>{S.r=b.dataset.r;render();scrollTo(0,0)});$('#findBtn').onclick=()=>{S.r='catalog';render();setTimeout(()=>$('#q')?.focus(),50)};render();
</script></body></html>
