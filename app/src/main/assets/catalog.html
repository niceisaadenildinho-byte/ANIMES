<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>Órbita Anime</title><style>
:root{--bg:#070708;--p:#121214;--p2:#18181c;--line:#29292f;--txt:#f8f8fa;--mut:#94949e;--red:#ff4937;--green:#29d98b;--blue:#4e8cff;--purple:#a45cff;--yellow:#ffd43b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{padding-bottom:88px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 15px;background:#09090be8;backdrop-filter:blur(14px);border-bottom:1px solid #1c1c20}.brand{font-weight:950;font-size:21px}.brand b{color:var(--red)}.top .searchIcon{margin-left:auto}.icon,.btn,.chip,.tab{border:1px solid var(--line);background:#141417;color:#fff}.icon{width:42px;height:42px;border-radius:50%}.main{max-width:900px;margin:auto;padding:0 15px}.hero{padding:24px 0 12px}.kicker{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:900}h1{font-size:42px;line-height:.98;letter-spacing:-2px;margin:8px 0 8px}h2{font-size:25px;letter-spacing:-1px;margin:22px 0 12px}.muted{color:var(--mut)}.search{display:flex;gap:8px;margin:15px 0}.search input,.filters select{width:100%;background:#121216;color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}.btn{padding:12px 14px;border-radius:14px;font-weight:850}.btn.red{background:linear-gradient(135deg,#ff4937,#ff684a);border:0}.btn.full{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:#b9b9c1}.chip.on{background:var(--red);border-color:var(--red);color:#fff}.combo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.combo button{text-align:left;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17171b,#101013);color:#fff;padding:14px}.combo b{display:block;font-size:15px}.combo span{font-size:11px;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0}.poster{position:relative;aspect-ratio:2/3;border-radius:17px;overflow:hidden;background:#18181d;border:1px solid #24242a}.poster img{width:100%;height:100%;object-fit:cover}.score{position:absolute;right:9px;bottom:9px;background:#27251b;border:1px solid #5c5225;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:900}.status{position:absolute;top:9px;right:9px;padding:5px 7px;border-radius:8px;background:#35353e;font-size:10px;font-weight:900}.status.vendo{background:var(--green);color:#042819}.status.fim{background:var(--blue)}.status.drop{background:var(--red)}.ct{font-size:14px;font-weight:850;margin:7px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm{display:flex;justify-content:space-between;gap:6px;color:var(--mut);font-size:11px;margin:0 4px}.tagline{font-size:10px;color:#b898ff;margin:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{background:linear-gradient(180deg,#151519,#101013);border:1px solid var(--line);border-radius:22px;padding:16px;margin:13px 0}.notice{padding:12px 14px;border:1px solid #3a241f;background:#1b1110;border-radius:16px;color:#ffc3b8;font-size:12px}.empty{text-align:center;padding:38px 15px;border:1px dashed #2a2a31;border-radius:20px;color:#85858f}.load{margin:18px 0 5px}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 13px;scrollbar-width:none}.tab{white-space:nowrap;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:#aaaab3}.tab.on{background:#fff;color:#09090a}.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px max(10px,env(safe-area-inset-bottom));background:#0d0d10ef;border-top:1px solid #222228;backdrop-filter:blur(16px)}.nav button{border:0;background:transparent;color:#767680;font-weight:800;font-size:10px;display:grid;gap:3px;justify-items:center}.nav button i{font-style:normal;font-size:21px}.nav button.on{color:var(--red)}.modal{display:none;position:fixed;inset:0;z-index:70;background:#000c;backdrop-filter:blur(9px);align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#0e0e11;border:1px solid #292930;border-radius:27px 27px 0 0;padding:17px 15px 28px}.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-17px;background:#0e0e11ef;padding:16px 0 9px;z-index:3}.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#17171b;color:#fff;font-size:20px}.row{display:flex;gap:10px}.row>*{flex:1}.field{margin:11px 0}.field label{display:block;color:#aaaab3;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;background:#121216;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.profile{text-align:center;padding:24px 0}.avatar{width:105px;height:105px;margin:auto;border-radius:50%;padding:5px;background:linear-gradient(135deg,var(--yellow),#ff922e)}.avatar div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#18181d;font-size:48px}.name{font-size:32px;font-weight:950;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#18181c;border:1px solid #26262d;border-radius:16px;padding:13px 8px;text-align:center}.stat small{display:block;color:var(--mut);font-size:9px;font-weight:900}.stat b{display:block;font-size:20px;margin-top:4px}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);opacity:0;transition:.2s;background:#202025;border:1px solid #35353d;border-radius:999px;padding:9px 14px;font-size:12px}.toast.on{opacity:1;transform:translateX(-50%)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.combo{grid-template-columns:repeat(4,1fr)}.nav{max-width:900px;left:50%;transform:translateX(-50%)}.sheet{max-width:720px;margin:auto}}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Órbita <b>Anime</b></div><button class="icon searchIcon" id="focusSearch">⌕</button></header><main class="main" id="view"></main><nav class="nav"><button data-r="catalog" class="on"><i>▦</i>Catálogo</button><button data-r="themes"><i>◈</i>Temas</button><button data-r="list"><i>▥</i>Minha Lista</button><button data-r="profile"><i>◉</i>Perfil</button></nav></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheethead"><h3>Detalhes do anime</h3><button class="close" onclick="modal('detailModal',false)">×</button></div><div id="detail"></div></div></div><div class="toast" id="toast"></div>
<script>
const API='https://api.jikan.moe/v4',$=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const S={r:'catalog',page:1,more:true,loading:false,q:'',type:'',year:'',order:'popularity',selected:[],genres:[],items:[],total:0,tab:'todos',list:JSON.parse(localStorage.getItem('oa_list')||'[]'),profile:JSON.parse(localStorage.getItem('oa_profile')||'{"name":"Mestre da Guilda","avatar":"🧙"}')};
const save=()=>{localStorage.setItem('oa_list',JSON.stringify(S.list));localStorage.setItem('oa_profile',JSON.stringify(S.profile))};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1700)};
async function api(p){let r=await fetch(API+p);if(!r.ok)throw Error('api');return r.json()}
const compact=a=>({id:a.mal_id,title:a.title_english||a.title||'Sem título',image:a.images?.webp?.large_image_url||a.images?.jpg?.large_image_url||'',score:a.score||null,episodes:a.episodes||0,type:a.type||'TV',year:a.year||a.aired?.prop?.from?.year||null,tags:[...(a.genres||[]),...(a.themes||[]),...(a.demographics||[])].map(x=>x.name),tagIds:[...(a.genres||[]),...(a.themes||[]),...(a.demographics||[])].map(x=>x.mal_id),synopsis:a.synopsis||'',status:'planos',watched:0});
const label=s=>({planos:'PLAN',vendo:'VENDO',fim:'FIM',drop:'DROP'}[s]||'');
function merged(a){let m=S.list.find(x=>x.id===a.id);return m?{...a,...m}:a}
function card(raw){let a=merged(raw);return `<article class="card" data-id="${a.id}"><div class="poster">${a.image?`<img loading="lazy" src="${esc(a.image)}" alt="">`:''}${S.list.some(x=>x.id===a.id)?`<span class="status ${a.status}">${label(a.status)}</span>`:''}${a.score?`<span class="score">★ ${Number(a.score).toFixed(1)}</span>`:''}</div><div class="ct">${esc(a.title)}</div><div class="cm"><span>${a.year||'—'} • ${a.episodes||'?'} eps</span><span>${esc(a.type)}</span></div><div class="tagline">${esc((a.tags||[]).slice(0,3).join(' • '))}</div></article>`}
function bind(host,arr){if(!host)return;$$('.card',host).forEach(c=>c.onclick=()=>details(arr.find(a=>String(a.id)===c.dataset.id)))}
function modal(id,on=true){$('#'+id).classList.toggle('on',on)}
async function loadGenres(){if(S.genres.length)return;try{let [g,t,d]=await Promise.all([api('/genres/anime?filter=genres'),api('/genres/anime?filter=themes'),api('/genres/anime?filter=demographics')]);S.genres=[...g.data,...t.data,...d.data].filter((x,i,a)=>a.findIndex(y=>y.mal_id===x.mal_id)===i).sort((a,b)=>a.name.localeCompare(b.name))}catch{S.genres=[{mal_id:62,name:'Isekai'},{mal_id:22,name:'Romance'},{mal_id:10,name:'Fantasy'},{mal_id:1,name:'Action'},{mal_id:4,name:'Comedy'},{mal_id:8,name:'Drama'},{mal_id:23,name:'School'},{mal_id:37,name:'Supernatural'},{mal_id:27,name:'Shounen'}]}}
function genreId(name){let g=S.genres.find(x=>x.name.toLowerCase()===name.toLowerCase());return g?.mal_id||''}
function queryString(){let p=new URLSearchParams({page:S.page,limit:'25',sfw:'true',order_by:S.order==='title'?'title':S.order,sort:S.order==='title'?'asc':'desc'});if(S.q)p.set('q',S.q);if(S.type)p.set('type',S.type);if(S.year){p.set('start_date',S.year+'-01-01');p.set('end_date',S.year+'-12-31')}if(S.selected.length){let ids=S.selected.map(x=>x.id).filter(Boolean);if(ids.length)p.set('genres',ids.join(','))}return '/anime?'+p.toString()}
async function loadCatalog(reset=false){if(S.loading)return;if(reset){S.page=1;S.more=true;S.items=[]}if(!S.more)return;S.loading=true;let btn=$('#loadMore');if(btn)btn.textContent='Carregando...';try{let j=await api(queryString());let arr=j.data.map(compact);if(S.selected.length){let names=S.selected.map(x=>x.name.toLowerCase());arr=arr.filter(a=>names.every(n=>(a.tags||[]).some(t=>t.toLowerCase()===n)))}let seen=new Set(S.items.map(x=>x.id));S.items.push(...arr.filter(x=>!seen.has(x.id)));S.total=j.pagination?.items?.total||S.total;S.more=!!j.pagination?.has_next_page;S.page++;drawCatalog()}catch{let grid=$('#catalogGrid');if(grid&&!S.items.length)grid.innerHTML='<div class="empty" style="grid-column:1/-1">Não consegui carregar o catálogo agora. Tente novamente.</div>';toast('Falha ao carregar catálogo')}finally{S.loading=false}}
function drawCatalog(){let g=$('#catalogGrid');if(!g)return;g.innerHTML=S.items.length?S.items.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nenhum anime encontrado com esses filtros.</div>';bind(g,S.items);let c=$('#totalCount');if(c)c.textContent=(S.total?S.total.toLocaleString('pt-BR')+' títulos encontrados':'Catálogo online');let b=$('#loadMore');if(b){b.style.display=S.more?'block':'none';b.textContent='Carregar mais animes'}}
function selectedChips(){return S.selected.map(x=>`<button class="chip on" data-remove="${x.id}">${esc(x.name)} ×</button>`).join('')}
async function catalog(){await loadGenres();view.innerHTML=`<section class="hero"><div class="kicker">CATÁLOGO COMPLETO</div><h1>Animes por tema, ano e gênero.</h1><div id="totalCount" class="muted">Carregando catálogo...</div></section><div class="search"><input id="catalogSearch" placeholder="Buscar anime por nome..." value="${esc(S.q)}"><button class="btn red" id="doSearch">Buscar</button></div><div class="filters"><select id="typeFilter"><option value="">Todos os formatos</option><option value="tv" ${S.type==='tv'?'selected':''}>TV</option><option value="movie" ${S.type==='movie'?'selected':''}>Filmes</option><option value="ova" ${S.type==='ova'?'selected':''}>OVA</option><option value="ona" ${S.type==='ona'?'selected':''}>ONA</option><option value="special" ${S.type==='special'?'selected':''}>Especial</option></select><select id="yearFilter"><option value="">Todos os anos</option>${Array.from({length:88},(_,i)=>2027-i).map(y=>`<option ${String(y)===S.year?'selected':''}>${y}</option>`).join('')}</select></div><div class="chips" id="selectedChips">${selectedChips()||'<span class="muted" style="font-size:12px">Nenhum tema selecionado. Vá em Temas para filtrar.</span>'}</div><div class="grid" id="catalogGrid"></div><button class="btn full load" id="loadMore">Carregar mais animes</button>`;$('#doSearch').onclick=()=>{S.q=$('#catalogSearch').value.trim();loadCatalog(true)};$('#catalogSearch').onkeydown=e=>{if(e.key==='Enter')$('#doSearch').click()};$('#typeFilter').onchange=e=>{S.type=e.target.value;loadCatalog(true)};$('#yearFilter').onchange=e=>{S.year=e.target.value;loadCatalog(true)};$$('[data-remove]').forEach(b=>b.onclick=()=>{S.selected=S.selected.filter(x=>String(x.id)!==b.dataset.remove);catalog();loadCatalog(true)});$('#loadMore').onclick=()=>loadCatalog(false);loadCatalog(S.items.length===0);drawCatalog()}
const combos=[['Isekai'],['Romance'],['Isekai','Romance'],['Fantasy'],['Action'],['Action','Fantasy'],['Comedy'],['Drama'],['School'],['Supernatural'],['Shounen'],['Fantasy','Romance'],['Action','Romance'],['Isekai','Fantasy'],['School','Romance'],['Supernatural','Action']];
async function themes(){await loadGenres();view.innerHTML=`<section class="hero"><div class="kicker">TEMAS</div><h1>Escolha o tipo de anime.</h1><div class="muted">Você pode combinar mais de um tema.</div></section><h2>Combinações rápidas</h2><div class="combo">${combos.map((c,i)=>`<button data-combo="${i}"><b>${c.join(' + ')}</b><span>Mostrar apenas animes dessa combinação</span></button>`).join('')}</div><h2>Todos os temas</h2><div class="chips" style="flex-wrap:wrap;overflow:visible">${S.genres.map(g=>`<button class="chip ${S.selected.some(x=>x.id===g.mal_id)?'on':''}" data-theme="${g.mal_id}">${esc(g.name)}</button>`).join('')}</div><button class="btn red full" id="applyThemes">Ver catálogo com esses temas</button>`;$$('[data-combo]').forEach(b=>b.onclick=()=>{let names=combos[Number(b.dataset.combo)];S.selected=names.map(n=>({id:genreId(n),name:n})).filter(x=>x.id);S.r='catalog';S.items=[];render()});$$('[data-theme]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.theme),g=S.genres.find(x=>x.mal_id===id);if(S.selected.some(x=>x.id===id))S.selected=S.selected.filter(x=>x.id!==id);else S.selected.push({id,name:g.name});b.classList.toggle('on')});$('#applyThemes').onclick=()=>{S.r='catalog';S.items=[];render()}}
function counts(){let c={todos:S.list.length,planos:0,vendo:0,fim:0,drop:0};S.list.forEach(a=>c[a.status]=(c[a.status]||0)+1);return c}
function list(){let c=counts(),arr=S.tab==='todos'?S.list:S.list.filter(x=>x.status===S.tab);view.innerHTML=`<section class="hero"><div class="kicker">SUA COLEÇÃO</div><h1>Minha Lista</h1><div class="muted">${c.todos} animes salvos</div></section><div class="tabs">${[['todos','Todos'],['vendo','Vendo'],['planos','Planos'],['fim','Finalizados'],['drop','Drop']].map(x=>`<button class="tab ${S.tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]} (${c[x[0]]||0})</button>`).join('')}</div><div class="grid" id="listGrid">${arr.length?arr.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nenhum anime aqui. Abra o Catálogo e adicione títulos.</div>'}</div>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;list()});bind($('#listGrid'),arr)}
function details(a){if(!a)return;let mine=S.list.find(x=>x.id===a.id),x=mine||a;$('#detail').innerHTML=`<div class="row" style="align-items:flex-start"><div class="poster" style="max-width:170px;flex:0 0 42%">${x.image?`<img src="${esc(x.image)}">`:''}</div><div><div class="kicker">${esc(x.type)} ${x.year?'• '+x.year:''}</div><h2 style="margin:8px 0">${esc(x.title)}</h2><div class="muted">${x.episodes||'?'} episódios ${x.score?'• ★ '+x.score:''}</div><div class="tagline" style="white-space:normal;margin-top:9px">${esc((x.tags||[]).join(' • '))}</div></div></div><p class="muted" style="line-height:1.55">${esc(x.synopsis||'Sem sinopse disponível.')}</p>${mine?`<div class="field"><label>Status</label><select id="status"><option value="planos" ${x.status==='planos'?'selected':''}>Planos</option><option value="vendo" ${x.status==='vendo'?'selected':''}>Vendo</option><option value="fim" ${x.status==='fim'?'selected':''}>Finalizado</option><option value="drop" ${x.status==='drop'?'selected':''}>Drop</option></select></div><div class="field"><label>Episódios assistidos</label><input id="watched" type="number" min="0" value="${x.watched||0}"></div><div class="row"><button class="btn red" id="saveAnime">Salvar</button><button class="btn" id="removeAnime">Remover</button></div>`:`<button class="btn red full" id="addAnime">＋ Adicionar aos Planos</button>`}`;modal('detailModal');if(mine){$('#saveAnime').onclick=()=>{mine.status=$('#status').value;mine.watched=Math.max(0,Number($('#watched').value)||0);if(mine.status==='fim'&&mine.episodes)mine.watched=Math.max(mine.watched,mine.episodes);save();modal('detailModal',false);render();toast('Anime atualizado')};$('#removeAnime').onclick=()=>{S.list=S.list.filter(z=>z.id!==mine.id);save();modal('detailModal',false);render();toast('Removido da lista')}}else $('#addAnime').onclick=()=>{S.list.unshift({...x,status:'planos',watched:0});save();modal('detailModal',false);toast('Adicionado aos Planos');render()}}
function profile(){let c=counts(),eps=S.list.reduce((s,a)=>s+(Number(a.watched)||0),0),tags={};S.list.forEach(a=>(a.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));let fav=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';view.innerHTML=`<section class="profile"><div class="avatar"><div>${esc(S.profile.avatar||'🧙')}</div></div><div class="name">${esc(S.profile.name)}</div><div class="muted">Explorador de catálogos</div></section><div class="stats"><div class="stat"><small>NA LISTA</small><b>${c.todos}</b></div><div class="stat"><small>CONCLUÍDOS</small><b>${c.fim}</b></div><div class="stat"><small>EPS VISTOS</small><b>${eps}</b></div></div><div class="panel"><div class="kicker">TEMA FAVORITO</div><h2 style="margin-bottom:4px">${esc(fav)}</h2><div class="muted">Calculado pelos animes da sua lista.</div></div>`}
function render(){$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.r));({catalog,themes,list,profile}[S.r]||catalog)()}
$$('.nav button').forEach(b=>b.onclick=()=>{S.r=b.dataset.r;render();scrollTo(0,0)});$('#focusSearch').onclick=()=>{S.r='catalog';render();setTimeout(()=>$('#catalogSearch')?.focus(),50)};render();
</script></body></html>
