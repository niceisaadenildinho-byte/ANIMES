<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>Órbita Anime</title>
<style>
:root{--bg:#070708;--panel:#121214;--line:#29292f;--text:#f7f7f8;--muted:#94949e;--red:#ff4b36;--green:#27d98b;--blue:#4f8cff;--purple:#a45cff;--yellow:#ffd43b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{padding-bottom:92px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 16px;background:#09090be8;backdrop-filter:blur(14px);border-bottom:1px solid #17171b}.brand{font-size:21px;font-weight:950}.brand b{color:var(--red)}.top button{margin-left:auto}.icon,.btn,.tab{border:1px solid var(--line);background:#141417;color:white}.icon{width:42px;height:42px;border-radius:50%;font-size:20px}.btn{padding:12px 15px;border-radius:15px;font-weight:850}.btn.red{background:linear-gradient(135deg,#ff4937,#ff684a);border:0}.main{max-width:820px;margin:auto;padding:0 16px}.hero{padding:24px 0 14px}.kicker{font-size:11px;letter-spacing:2px;color:var(--red);font-weight:900}h1{font-size:42px;line-height:.98;letter-spacing:-2px;margin:8px 0 10px}h2{font-size:27px;letter-spacing:-1px}.muted{color:var(--muted)}.feature,.panel{background:linear-gradient(180deg,#151519,#0f0f12);border:1px solid var(--line);border-radius:24px;padding:17px}.feature{display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 15px 50px #ff49370d}.feature strong{display:block;font-size:20px;margin-bottom:5px}.search{display:flex;gap:9px;margin:18px 0}.search input,.field input,.field select{width:100%;background:#121216;color:white;border:1px solid var(--line);border-radius:15px;padding:13px 14px;outline:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0}.poster{position:relative;aspect-ratio:2/3;border-radius:17px;overflow:hidden;background:#1a1a1f;border:1px solid #24242a}.poster img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:9px;top:9px;padding:6px 8px;border-radius:8px;font-size:10px;font-weight:900;background:#3a3a42}.badge.vendo{background:var(--green);color:#05261a}.badge.fim{background:var(--blue)}.badge.drop{background:var(--red)}.score{position:absolute;right:9px;bottom:9px;background:#27251b;border:1px solid #5d5327;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:900}.ct{font-size:14px;font-weight:850;margin:7px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:0 4px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.tab{white-space:nowrap;border-radius:999px;padding:9px 14px;color:#aaaab3;font-weight:800}.tab.on{background:white;color:#09090a}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px max(10px,env(safe-area-inset-bottom));background:#0d0d10ef;border-top:1px solid #222228;backdrop-filter:blur(16px)}.nav button{border:0;background:transparent;color:#767680;font-weight:800;font-size:11px;display:grid;gap:3px;justify-items:center}.nav button i{font-style:normal;font-size:22px}.nav button.on{color:var(--red)}.empty{text-align:center;padding:40px 16px;color:#85858f;border:1px dashed #2a2a31;border-radius:20px}.modal{display:none;position:fixed;inset:0;z-index:60;background:#000c;backdrop-filter:blur(9px);align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:91vh;overflow:auto;background:#0e0e11;border:1px solid #2a2a30;border-radius:28px 28px 0 0;padding:17px 16px 28px}.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-17px;background:#0e0e11ef;padding:17px 0 10px;z-index:2}.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#17171b;color:white;font-size:20px}.result{display:flex;gap:11px;background:#151519;border:1px solid #24242b;border-radius:15px;padding:9px;margin:9px 0}.result img{width:62px;height:88px;object-fit:cover;border-radius:10px}.result div{min-width:0}.result b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;gap:10px}.row>*{flex:1}.field{margin:12px 0}.field label{display:block;color:#aaaab3;font-size:12px;font-weight:800;margin-bottom:6px}.profile{text-align:center;padding:25px 0}.avatar{width:108px;height:108px;margin:auto;border-radius:50%;padding:5px;background:linear-gradient(135deg,var(--yellow),#ff8f2d)}.avatar div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#18181d;font-size:50px}.rank{display:inline-block;margin-top:-8px;padding:6px 12px;border-radius:999px;border:1px solid #655713;background:#151515;color:var(--yellow);font-size:11px;font-weight:900}.name{font-size:34px;font-weight:950;letter-spacing:-1.5px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#18181c;border:1px solid #26262d;border-radius:16px;padding:13px 8px;text-align:center}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:1px}.stat b{display:block;font-size:21px;margin-top:4px}.progress{height:8px;background:#25252d;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ffe985)}.dist{display:flex;height:11px;border-radius:99px;overflow:hidden;margin-top:12px;background:#222}.toast{position:fixed;z-index:100;left:50%;bottom:105px;transform:translateX(-50%) translateY(15px);opacity:0;transition:.2s;background:#202025;border:1px solid #36363d;border-radius:999px;padding:9px 14px;font-size:12px}.toast.on{opacity:1;transform:translateX(-50%)}@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:820px;left:50%;transform:translateX(-50%)}.sheet{max-width:700px;margin:auto}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">Órbita <b>Anime</b></div><button class="icon" id="openSearch">⌕</button></header><main class="main" id="view"></main><nav class="nav"><button data-r="home" class="on"><i>⌂</i>Início</button><button data-r="list"><i>▥</i>Lista</button><button data-r="feed"><i>◎</i>Feed</button><button data-r="profile"><i>◉</i>Perfil</button></nav></div>
<div class="modal" id="searchModal"><div class="sheet"><div class="sheethead"><h3>Adicionar anime</h3><button class="close" data-close="searchModal">×</button></div><div class="search"><input id="q" placeholder="Digite o nome do anime..."></div><div id="results"><div class="empty">Pesquise um anime para adicionar.</div></div></div></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheethead"><h3>Detalhes</h3><button class="close" data-close="detailModal">×</button></div><div id="detail"></div></div></div>
<div class="modal" id="randomModal"><div class="sheet"><div class="sheethead"><h3>O que vou assistir hoje?</h3><button class="close" data-close="randomModal">×</button></div><div id="random"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const API='https://api.jikan.moe/v4',$=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const S={r:'home',tab:'todos',list:JSON.parse(localStorage.getItem('oa_list')||'[]'),feed:JSON.parse(localStorage.getItem('oa_feed')||'[]'),profile:JSON.parse(localStorage.getItem('oa_profile')||'{"name":"Mestre da Guilda","avatar":"🧙"}'),home:[]};
const save=()=>{localStorage.setItem('oa_list',JSON.stringify(S.list));localStorage.setItem('oa_feed',JSON.stringify(S.feed.slice(0,100)));localStorage.setItem('oa_profile',JSON.stringify(S.profile))};
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1700)};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const compact=a=>({id:a.mal_id,title:a.title_english||a.title||'Sem título',image:a.images?.webp?.large_image_url||a.images?.jpg?.large_image_url||'',score:a.score||null,episodes:a.episodes||0,type:a.type||'TV',year:a.year||a.aired?.prop?.from?.year||null,genres:(a.genres||[]).map(g=>g.name),synopsis:a.synopsis||'',status:'planos',watched:0});
const label=s=>({planos:'PLAN',vendo:'VENDO',fim:'FIM',drop:'DROP'}[s]||'PLAN');
const card=a=>`<article class="card" data-id="${a.id}"><div class="poster"><img loading="lazy" src="${esc(a.image)}"><span class="badge ${a.status||''}">${label(a.status)}</span>${a.score?`<span class="score">★ ${Number(a.score).toFixed(1)}</span>`:''}</div><div class="ct">${esc(a.title)}</div><div class="cm"><span>${a.episodes||'?'} eps</span><span>${esc(a.type)}</span></div></article>`;
function modal(id,on=true){$('#'+id).classList.toggle('on',on)}$$('[data-close]').forEach(b=>b.onclick=()=>modal(b.dataset.close,false));$$('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)modal(m.id,false)});
async function api(p){let r=await fetch(API+p);if(!r.ok)throw Error();return r.json()}
function bind(host,items){if(!host)return;$$('.card',host).forEach(c=>c.onclick=()=>details(items.find(a=>String(a.id)===c.dataset.id)))}
async function homeData(){let h=$('#homeGrid');if(!h)return;h.innerHTML='<div class="empty" style="grid-column:1/-1">Carregando temporada...</div>';try{let j=await api('/seasons/now?limit=12&sfw=true');S.home=j.data.map(compact);h.innerHTML=S.home.map(card).join('');bind(h,S.home)}catch{h.innerHTML='<div class="empty" style="grid-column:1/-1">Não consegui carregar o catálogo. Verifique sua internet.</div>'}}
function home(){view.innerHTML=`<section class="hero"><div class="kicker">SUA JORNADA OTAKU</div><h1>Descubra, organize e evolua.</h1><div class="feature"><div><strong>🎲 O que eu vou assistir hoje?</strong><span class="muted">Sorteie um anime da sua coleção.</span></div><button class="btn red" id="roll">Sortear</button></div></section><div class="search"><input id="quick" placeholder="Buscar anime..."><button class="btn red" id="qb">Buscar</button></div><h2>Em temporada</h2><div class="grid" id="homeGrid"></div>`;$('#roll').onclick=randomAnime;$('#qb').onclick=()=>{modal('searchModal');$('#q').value=$('#quick').value;search($('#quick').value)};$('#quick').onkeydown=e=>{if(e.key==='Enter')$('#qb').click()};homeData()}
function counts(){let c={todos:S.list.length,planos:0,vendo:0,fim:0,drop:0};S.list.forEach(a=>c[a.status]++);return c}
function list(){let c=counts(),arr=S.tab==='todos'?S.list:S.list.filter(a=>a.status===S.tab);view.innerHTML=`<section class="hero"><div class="row" style="align-items:center"><div><h1>Minha Coleção</h1><div class="muted">${c.todos} títulos listados</div></div><button class="btn red" id="add">＋ Adicionar</button></div></section><div class="tabs">${[['todos','Todos'],['vendo','Vendo'],['planos','Planos'],['fim','Finalizados'],['drop','Drop']].map(x=>`<button class="tab ${S.tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]} (${c[x[0]]})</button>`).join('')}</div><div class="grid" id="listGrid">${arr.length?arr.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Sua coleção ainda está vazia.</div>'}</div>`;$('#add').onclick=()=>modal('searchModal');$$('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;list()});bind($('#listGrid'),arr)}
function addFeed(a,b){S.feed.unshift({a,b,t:Date.now()})}
function details(a){if(!a)return;let mine=S.list.find(x=>x.id===a.id),x=mine||a;$('#detail').innerHTML=`<div class="row" style="align-items:flex-start"><div class="poster" style="max-width:170px"><img src="${esc(x.image)}"></div><div><div class="kicker">${esc(x.type)} ${x.year?'• '+x.year:''}</div><h2>${esc(x.title)}</h2><div class="muted">${x.episodes||'?'} episódios ${x.score?'• ★ '+x.score:''}</div></div></div><p class="muted" style="line-height:1.55">${esc(x.synopsis||'Sem sinopse disponível.')}</p>${mine?`<div class="field"><label>Status</label><select id="st"><option value="planos" ${x.status==='planos'?'selected':''}>Planos</option><option value="vendo" ${x.status==='vendo'?'selected':''}>Vendo</option><option value="fim" ${x.status==='fim'?'selected':''}>Finalizado</option><option value="drop" ${x.status==='drop'?'selected':''}>Drop</option></select></div><div class="field"><label>Episódios assistidos</label><input id="wat" type="number" min="0" value="${x.watched||0}"></div><div class="row"><button class="btn red" id="sv">Salvar</button><button class="btn" id="rm">Remover</button></div>`:`<button class="btn red" id="ad">＋ Adicionar aos Planos</button>`}`;modal('detailModal');if(mine){$('#sv').onclick=()=>{mine.status=$('#st').value;mine.watched=Math.max(0,+$('#wat').value||0);if(mine.status==='fim'&&mine.episodes)mine.watched=Math.max(mine.watched,mine.episodes);addFeed('Atualizou '+mine.title,label(mine.status));save();modal('detailModal',false);render();toast('Anime atualizado')};$('#rm').onclick=()=>{S.list=S.list.filter(z=>z.id!==mine.id);addFeed('Removeu '+mine.title,'Saiu da coleção');save();modal('detailModal',false);render();toast('Removido')}}else $('#ad').onclick=()=>add(a)}
function add(a){if(S.list.some(x=>x.id===a.id))return toast('Já está na coleção');S.list.unshift({...a,status:'planos',watched:0});addFeed('Adicionou '+a.title,'Entrou em Planos');save();modal('detailModal',false);modal('searchModal',false);toast('Adicionado à coleção');if(S.r==='list')list()}
function feed(){view.innerHTML=`<section class="hero"><div class="kicker">ATIVIDADE</div><h1>Feed</h1><div class="muted">Suas ações recentes.</div></section><div class="panel">${S.feed.length?S.feed.map(f=>`<div style="padding:13px 0;border-bottom:1px solid #24242a"><b>⚡ ${esc(f.a)}</b><div class="muted">${esc(f.b)}</div><small class="muted">${new Date(f.t).toLocaleString('pt-BR')}</small></div>`).join(''):'<div class="empty">Seu feed começa quando você usa a coleção.</div>'}</div>`}
function pstats(){let ep=S.list.reduce((s,a)=>s+(+a.watched||0),0),exp=ep*25+S.list.length*10,ranks=[[0,'E'],[500,'D'],[1200,'C'],[2500,'B'],[5000,'A'],[9000,'S'],[16000,'SS'],[30000,'SSS']],rank='E',base=0,next=500;ranks.forEach((r,i)=>{if(exp>=r[0]){rank=r[1];base=r[0];next=ranks[i+1]?.[0]||exp+5000}});return{ep,exp,rank,base,next}}
function profile(){let s=pstats(),c=counts(),pct=Math.min(100,(s.exp-s.base)/(s.next-s.base)*100),tot=Math.max(1,c.todos);view.innerHTML=`<section class="profile"><div class="avatar"><div>${esc(S.profile.avatar)}</div></div><div class="rank">♕ RANK ${s.rank}</div><div class="name">${esc(S.profile.name)}</div><div class="muted" style="letter-spacing:2px;font-weight:800">MESTRE DA GUILDA</div><button class="btn" id="edit" style="margin-top:13px">✎ Editar Perfil</button></section><div class="muted" style="display:flex;justify-content:space-between;font-size:11px"><b>EXP: ${s.exp}</b><b>PRÓX: ${s.next}</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="stats"><div class="stat"><small>PODER</small><b>${(s.exp*15+500).toLocaleString('pt-BR')}</b></div><div class="stat"><small>EP VISTOS</small><b>${s.ep}</b></div><div class="stat"><small>CONCLUÍDOS</small><b style="color:var(--red)">${c.fim}</b></div></div><div class="panel" style="margin-top:15px"><b>ANÁLISE DA COLEÇÃO</b><div class="dist"><i style="width:${c.fim/tot*100}%;background:var(--blue)"></i><i style="width:${c.vendo/tot*100}%;background:var(--green)"></i><i style="width:${c.planos/tot*100}%;background:var(--purple)"></i><i style="width:${c.drop/tot*100}%;background:var(--red)"></i></div><p class="muted">${c.fim} finalizados • ${c.vendo} vendo • ${c.planos} planos • ${c.drop} drop</p></div>`;$('#edit').onclick=editProfile}
function editProfile(){$('#detail').innerHTML=`<h2>Editar perfil</h2><div class="field"><label>Nome</label><input id="pn" value="${esc(S.profile.name)}" maxlength="24"></div><div class="field"><label>Avatar em emoji</label><input id="pa" value="${esc(S.profile.avatar)}" maxlength="4"></div><button class="btn red" id="ps" style="width:100%">Salvar</button>`;modal('detailModal');$('#ps').onclick=()=>{S.profile.name=$('#pn').value.trim()||'Mestre da Guilda';S.profile.avatar=$('#pa').value.trim()||'🧙';save();modal('detailModal',false);profile();toast('Perfil salvo')}}
function randomAnime(){let pool=S.list.filter(a=>a.status==='planos');if(!pool.length)pool=S.list;if(!pool.length){toast('Adicione animes primeiro');return modal('searchModal')}let a=pool[Math.floor(Math.random()*pool.length)];$('#random').innerHTML=`<div style="text-align:center"><div class="kicker">SUA PRÓXIMA JORNADA!</div><div class="poster" style="max-width:310px;margin:12px auto;border:4px solid var(--red)"><img src="${esc(a.image)}"></div><h2>${esc(a.title)}</h2><div class="row"><button class="btn" id="again">Sortear Novo</button><button class="btn red" id="start">▶ Começar</button></div></div>`;modal('randomModal');$('#again').onclick=randomAnime;$('#start').onclick=()=>{let m=S.list.find(x=>x.id===a.id);if(m)m.status='vendo';addFeed('Começou '+a.title,'Agora está em Vendo');save();modal('randomModal',false);S.r='list';S.tab='vendo';render();toast('Boa sessão! 🍿')}}
function render(){$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.r));({home,list,feed,profile}[S.r]||home)()}$$('.nav button').forEach(b=>b.onclick=()=>{S.r=b.dataset.r;render();scrollTo(0,0)});$('#openSearch').onclick=()=>modal('searchModal');
let timer;$('#q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),450)};async function search(q){q=(q||'').trim();let h=$('#results');if(q.length<2)return h.innerHTML='<div class="empty">Digite pelo menos 2 letras.</div>';h.innerHTML='<div class="empty">Buscando...</div>';try{let j=await api('/anime?q='+encodeURIComponent(q)+'&limit=12&sfw=true&order_by=popularity'),arr=j.data.map(compact);h.innerHTML=arr.length?arr.map(a=>`<div class="result" data-id="${a.id}"><img src="${esc(a.image)}"><div><b>${esc(a.title)}</b><p class="muted" style="font-size:12px">${a.year||'—'} • ${esc(a.type)} • ${a.episodes||'?'} eps ${a.score?'• ★ '+a.score:''}</p><button class="btn red" data-add="${a.id}" style="padding:8px 11px">Adicionar</button></div></div>`).join(''):'<div class="empty">Nenhum resultado.</div>';$$('[data-add]',h).forEach(b=>b.onclick=e=>{e.stopPropagation();add(arr.find(a=>String(a.id)===b.dataset.add))});$$('.result',h).forEach(r=>r.onclick=()=>details(arr.find(a=>String(a.id)===r.dataset.id)))}catch{h.innerHTML='<div class="empty">Falha ao buscar. Tente novamente.</div>'}}
render();
</script>
</body></html>
