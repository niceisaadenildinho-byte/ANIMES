<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>Órbita Anime Online</title><style>html,body,#appFrame{margin:0;width:100%;height:100%;border:0;background:#070708}html,body{overflow:hidden}#appFrame{position:fixed;inset:0}.freeBtn{position:fixed;right:14px;top:14px;z-index:30;border:1px solid #ffffff24;background:#15151bd9;color:#fff;border-radius:999px;padding:10px 13px;font:700 12px system-ui;box-shadow:0 8px 26px #0008;backdrop-filter:blur(10px)}</style></head><body><iframe id="appFrame" src="offline_catalog.html" allow="fullscreen; autoplay"></iframe><button class="freeBtn" onclick="location.href='free_content.html'">🎞️ Conteúdo Livre</button><script>const f=document.getElementById('appFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument;const load=(src)=>new Promise((ok,fail)=>{const s=d.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;d.body.appendChild(s)});load('video_sources.js').then(()=>load('online_enhance.js')).then(()=>load('player_enhance.js')).catch(console.error)}catch(e){console.error(e)}});</script></body></html>
