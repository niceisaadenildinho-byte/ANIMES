plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orbita.anime'
    compileSdk 35

    defaultConfig {
        applicationId 'app.orbita.anime'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
